<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathfinder App</title>
<meta name="description" content="Try Pathfinder: tell it your goal, take a short skill quiz and get a learning pathway and weekly study plan. Llama 3.2 runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell = sticky top bar (brand, model status) + step bar + one screen at a time in a 760px column. Tokens match index.html. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #13202c; --muted: #566577; --line: #d8dee5;
  --accent: #2450d6; --accent-soft: #e4ebfd; --mark: #f2b705; --good: #17734a; --wait: #8a5509; --bad: #b42318;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px; --ease-out: cubic-bezier(0, 0, 0.58, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141b; --surface: #16202a; --ink: #e6ecf2; --muted: #9aa8b6; --line: #273340;
    --accent: #86a6ff; --accent-soft: #1b2948; --mark: #f5c842; --good: #4cc38a; --wait: #e0a84a; --bad: #f97066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #16202a; --ink: #e6ecf2; --muted: #9aa8b6; --line: #273340;
  --accent: #86a6ff; --accent-soft: #1b2948; --mark: #f5c842; --good: #4cc38a; --wait: #e0a84a; --bad: #f97066;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.6rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 20; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { max-width: 1080px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; flex-wrap: wrap; padding-block: 8px; }
.brand { font: 700 1.1rem/1 var(--font-display); color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.model { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; }
.pill { font: 500 0.72rem/1 var(--font-mono); padding: 6px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.pill.good { color: var(--good); border-color: transparent; background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.wait { color: var(--wait); border-color: transparent; background: color-mix(in srgb, var(--wait) 14%, transparent); }
.pill.accent { color: var(--accent); border-color: transparent; background: var(--accent-soft); }
.progress { width: 160px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.3s; }

/* Steps */
.steps { list-style: none; display: flex; gap: 6px; padding: 0; margin: 20px 0 8px; overflow-x: auto; scrollbar-width: none; }
.steps li { flex: 1 0 auto; }
.steps button { width: 100%; font: 500 0.78rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.steps button[aria-current="step"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.steps button:disabled { opacity: 0.5; cursor: default; }

main { padding-block: 16px 72px; }
.screen { display: grid; gap: 18px; animation: in 0.35s var(--ease-out) both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen, .bar > i, .progress > i { animation: none; transition: none; } }
.lead { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { font: 600 0.95rem/1 var(--font-body); padding: 12px 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.small { font-size: 0.85rem; padding: 8px 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.hint { color: var(--muted); font-size: 0.85rem; }
.source { font: 500 0.7rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }

/* Chat */
.bubble { max-width: 88%; padding: 12px 15px; border-radius: 14px; line-height: 1.55; }
.bubble.bot { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; justify-self: start; }
.bubble.me { background: var(--accent); color: var(--surface); border-top-right-radius: 4px; justify-self: end; }
.thinking::after { content: "…"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
textarea, input[type="number"], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
textarea { resize: vertical; min-height: 110px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: grid; gap: 6px; font-size: 0.9rem; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-toggle { position: relative; }
.chip-toggle input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip-toggle span { display: inline-block; font-size: 0.85rem; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip-toggle input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip-toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Quiz */
fieldset { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px 16px; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-weight: 600; padding: 0 4px; }
.skill-tag { font: 500 0.7rem/1 var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg .opt { justify-content: center; }

/* Pathway */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 200px) 1fr auto; gap: 12px; align-items: center; font-size: 0.9rem; }
.bar { position: relative; height: 10px; background: var(--line); border-radius: 999px; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); animation: grow 0.6s var(--ease-out) both; }
.bar > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
@keyframes grow { from { width: 0; } }
.num { font: 0.8rem/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.path li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.path li::before { content: counter(s); font: 700 0.85rem/30px var(--font-display); text-align: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.path li.done::before { content: "✓"; background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.path .meta { color: var(--muted); font-size: 0.85rem; }
.explain { border-left: 3px solid var(--mark); padding-left: 14px; }

/* Plan */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 2px; }
.stat b { font: 700 1.4rem/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.82rem; }
.session { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.session:first-of-type { border-top: 0; }
.session input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--good); }
.session select { width: auto; padding: 6px 8px; font-size: 0.85rem; }
.session.is-done .s-name { text-decoration: line-through; color: var(--muted); }
.upcoming { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 0.9rem; }
.upcoming li { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; color: var(--muted); }
.upcoming b { color: var(--ink); font-weight: 600; }
.warn { border-color: color-mix(in srgb, var(--wait) 40%, var(--line)); background: color-mix(in srgb, var(--wait) 8%, var(--surface)); }

@media (max-width: 600px) {
  .fields, .stats { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 1fr auto; }
  .bar-row .bar { grid-column: 1 / -1; grid-row: 2; }
  .seg { grid-template-columns: 1fr; }
  .bubble { max-width: 100%; }
  .session { grid-template-columns: auto 1fr; }
  .session select { grid-column: 2; justify-self: start; }
  .upcoming li { grid-template-columns: 60px 1fr; }
  .upcoming li .num { grid-column: 2; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Pathfinder home">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="4" cy="17" r="3" fill="var(--good)"/><circle cx="11" cy="9" r="3" fill="var(--mark)"/><circle cx="18" cy="4" r="3" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M6 15.5 9 11M13 7.5l3-2" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>
      Pathfinder
    </a>
    <div class="model" id="model" aria-live="polite"></div>
  </div>
</header>
<div class="wrap">
  <nav aria-label="App steps"><ol class="steps" id="steps"></ol></nav>
  <main id="main" aria-live="polite"></main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
